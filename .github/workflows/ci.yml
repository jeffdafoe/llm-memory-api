name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go-client:
    name: Go Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go/client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/client/go.mod
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Build (linux/amd64)
        run: go build ./cmd/memory-sync/

      - name: Build (windows/amd64)
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build ./cmd/memory-sync/

      - name: Build (darwin/arm64)
        env:
          GOOS: darwin
          GOARCH: arm64
        run: go build ./cmd/memory-sync/

      - name: Test
        run: go test ./...

  # The Go port of the server (LLM-902). Built and tested on every PR; not
  # deployed until the switch. Unit tests use pgxmock, so no database yet.
  go-server:
    name: Go Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go/server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/server/go.mod
          cache: false

      # The VPS builds with go.mod's `toolchain` version; this line shows in
      # the log which one CI ran.
      - name: Go version
        run: go version

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/memory-api

      - name: Test
        run: go test -race ./...

  node-api:
    name: Node API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node/api
    steps:
      - uses: actions/checkout@v7

      # Node 24 matches the runtime Ansible installs on the VPS
      # (infrastructure/group_vars/all.yml: nodejs_version).
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: node/api/package-lock.json

      - name: Install
        run: npm ci

      # `node --test` with no path argument recursively discovers both
      # src/**/*.test.js (node:test suites) and scripts/test-*.js (standalone
      # assertion scripts), skipping node_modules. No glob argument — glob
      # support in the test runner postdates Node 20.
      - name: Test
        run: npm test

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go-client:
    name: Go Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go/client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/client/go.mod
          cache: false

      # Shows in the log which toolchain ran (go.mod's `toolchain` line).
      - name: Go version
        run: go version

      - name: Vet
        run: go vet ./...

      - name: Build (linux/amd64)
        run: go build ./cmd/memory-sync/

      - name: Build (windows/amd64)
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build ./cmd/memory-sync/

      - name: Build (darwin/arm64)
        env:
          GOOS: darwin
          GOARCH: arm64
        run: go build ./cmd/memory-sync/

      - name: Test
        run: go test ./...

      # Known vulnerabilities in the pinned Go toolchain and in the required
      # modules, reported only where this code reaches them. A new Go
      # security release turns this red, which is the signal to raise the
      # toolchain line in go.mod. govulncheck is a `tool` in go.mod, so
      # Dependabot's gomod updates bump it.
      - name: Vulnerability check
        run: go tool govulncheck ./...

  # The Go port of the server (LLM-902). Built and tested on every PR; not
  # deployed until the switch. Unit tests use pgxmock, so no database yet.
  go-server:
    name: Go Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go/server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/server/go.mod
          cache: false

      # Shows in the log which toolchain ran (go.mod's `toolchain` line).
      - name: Go version
        run: go version

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/memory-api

      - name: Test
        run: go test -race ./...

      # See the go-client job: a reachable vulnerability in the toolchain or a
      # module fails the build.
      - name: Vulnerability check
        run: go tool govulncheck ./...

  # A fresh install from the baseline (LLM-908): build an empty database the
  # way roles/postgresql, tasks/run-migrations.yml and tasks/create-admin.yml do
  # on a new server, then the server must start and answer /health, and the new
  # admin must log in and read an admin page. psql runs inside the pgvector
  # container so its version matches the dump (pg17 dumps carry a \restrict
  # line that older clients reject).
  fresh-install:
    name: Fresh Install
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://memory_api:ci@localhost:5432/memory_api
    steps:
      - uses: actions/checkout@v7

      # The job context (the service container's id) is not available in
      # job-level env, only in steps.
      - name: Point psql at the database container
        run: echo "PSQL=docker exec -i ${{ job.services.postgres.id }} psql -U postgres -v ON_ERROR_STOP=1" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/server/go.mod
          cache: false

      - name: Build the server
        working-directory: go/server
        run: go build -o "$RUNNER_TEMP/memory-api" ./cmd/memory-api

      - name: Create the database and its user
        run: |
          $PSQL -c "CREATE USER memory_api WITH PASSWORD 'ci'"
          $PSQL -c "CREATE DATABASE memory_api OWNER memory_api"
          $PSQL -d memory_api -c "CREATE EXTENSION IF NOT EXISTS vector"
          $PSQL -d memory_api -c "CREATE TABLE IF NOT EXISTS migrations_applied (migration_id VARCHAR(50) PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW())"

      - name: Load the baseline
        run: cat migrations/schema.sql migrations/seed.sql | $PSQL -d memory_api --single-transaction -f -

      - name: Apply migrations after the baseline
        run: |
          for f in $(ls migrations/*_up.sql 2>/dev/null | sort); do
            echo "applying $f"
            $PSQL -d memory_api -f - < "$f"
          done

      - name: Generate the secret keys and grant the app user
        run: |
          $PSQL -d memory_api -c "UPDATE config SET value = encode(sha256((gen_random_uuid()::text || gen_random_uuid()::text)::bytea), 'hex') WHERE key IN ('mcp_oauth_bearer_secret', 'virtual_agent_encryption_key') AND coalesce(value, '') = ''"
          $PSQL -d memory_api -c "GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO memory_api; GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO memory_api;"

      - name: Create the admin user
        run: |
          "$RUNNER_TEMP/memory-api" create-user ci-admin ci-admin-password
          $PSQL -d memory_api -c "INSERT INTO admin_permissions (actor_id, resource, action) SELECT id, '*', '*' FROM actors WHERE name = 'ci-admin'"

      # The process keeps running for the later steps of this job.
      - name: Start the server
        env:
          PORT: '3100'
          BASE_URL: http://127.0.0.1:3100
          LOG_DIR: ${{ runner.temp }}/logs
        run: |
          mkdir -p "$LOG_DIR"
          nohup "$RUNNER_TEMP/memory-api" > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/health)" = "200" ]; then
              echo "health 200 after ${i}s"; exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/server.log"; exit 1

      - name: Log in as the admin and read an admin page
        run: |
          login=$(curl -s -X POST http://127.0.0.1:3100/v1/admin/login -H 'Content-Type: application/json' \
            -d '{"username":"ci-admin","password":"ci-admin-password"}')
          token=$(echo "$login" | jq -r '.session_token // empty')
          [ -n "$token" ] || { echo "login failed: $login"; cat "$RUNNER_TEMP/server.log"; exit 1; }
          templates=$(curl -s -X POST http://127.0.0.1:3100/v1/admin/templates/list -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' -d '{}' | jq '.templates | length')
          [ "$templates" = "2" ] || { echo "templates list: $templates"; cat "$RUNNER_TEMP/server.log"; exit 1; }
          echo "admin login ok, $templates templates"

      - name: Server log
        if: always()
        run: cat "$RUNNER_TEMP/server.log" || true

  # The deploy's build check (infrastructure/roles/memory-api-go/files/
  # verify-build.sh, LLM-976) against the newest published per-commit build:
  # both files must verify with the ci.yml-on-main signer and their own
  # commit, and a changed file, a wrong signer, and a genuine file checked
  # against another commit (the previous build's) must not. cosign-release is the version
  # infrastructure/group_vars/all.yml pins (cosign_version); stale-pins.sh
  # checks that the two agree.
  verify-build:
    name: Verify Build Script
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SIGNER: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main
      SCRIPT: infrastructure/roles/memory-api-go/files/verify-build.sh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A full tag: this action publishes no moving major tag (no v4).
      # Dependabot's github-actions updates keep it current.
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.1.4'

      # The build's commit is its tag's suffix. OTHER is the previous build's
      # commit, for the substitution test.
      - name: Download the newest per-commit build
        run: |
          tags=$(gh release list --exclude-drafts --limit 100 --json tagName,createdAt \
              --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[0:2] | .[].tagName')
          tag=$(printf '%s\n' "$tags" | sed -n 1p)
          other=$(printf '%s\n' "$tags" | sed -n 2p)
          test -n "$tag" && test -n "$other"
          echo "Checking $tag; another commit: $other"
          echo "COMMIT=${tag#build-}" >> "$GITHUB_ENV"
          echo "OTHER=${other#build-}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/build"
          gh release download "$tag" -p memory-api -p admin-dist.tar.gz -D "$RUNNER_TEMP/build"

      - name: Both files verify
        run: |
          bash "$SCRIPT" "$RUNNER_TEMP/build/memory-api" "$SIGNER" "$COMMIT"
          bash "$SCRIPT" "$RUNNER_TEMP/build/admin-dist.tar.gz" "$SIGNER" "$COMMIT"

      - name: A changed file, a wrong signer and another commit are refused
        run: |
          cp "$RUNNER_TEMP/build/memory-api" "$RUNNER_TEMP/changed"
          printf 'x' >> "$RUNNER_TEMP/changed"
          if bash "$SCRIPT" "$RUNNER_TEMP/changed" "$SIGNER" "$COMMIT"; then
              echo "a changed file verified"
              exit 1
          fi
          wrong="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main"
          if bash "$SCRIPT" "$RUNNER_TEMP/build/memory-api" "$wrong" "$COMMIT"; then
              echo "a wrong signer verified"
              exit 1
          fi
          if bash "$SCRIPT" "$RUNNER_TEMP/build/memory-api" "$SIGNER" "$OTHER"; then
              echo "a genuine build verified for another commit"
              exit 1
          fi

  # The admin UI half of the per-commit build. Vite runs dependency code
  # (plugins, and the packages it bundles), so it runs here, with read-only
  # permissions, and not in build-artifacts, which can write releases and
  # sign attestations. --ignore-scripts keeps install hooks from running too.
  build-admin-ui:
    name: Build Admin UI
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: node/api/package-lock.json

      - name: Build
        working-directory: node/api
        run: |
          npm ci --ignore-scripts
          npx vite build
          tar -czf "$RUNNER_TEMP/admin-dist.tar.gz" -C public/admin/dist .

      - uses: actions/upload-artifact@v7
        with:
          name: admin-dist
          path: ${{ runner.temp }}/admin-dist.tar.gz
          if-no-files-found: error
          retention-days: 1

  # Per-commit build of what the deploy installs (LLM-904): the Go server
  # binary and the admin UI's Vite output, published with their checksums as
  # the prerelease build-<sha>. infrastructure/roles/memory-api-go downloads
  # the build for the commit it deploys, so the VPS compiles nothing. Runs
  # only on main, and only once the Go server tests pass.
  build-artifacts:
    name: Build Artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go-server, build-admin-ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # id-token mints the OIDC token for the Sigstore signing certificate;
      # attestations stores the attestation.
      id-token: write
      attestations: write
    # No concurrency group: a group holds one pending job, and a newer one
    # replaces it, so a commit between two quick merges would get no build.
    env:
      GH_TOKEN: ${{ github.token }}
      # The publish step runs outside the checkout, so gh needs the
      # repository named.
      GH_REPO: ${{ github.repository }}
      TAG: build-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/server/go.mod
          cache: false

      # Static linux/amd64 binary with no runtime dependencies. Its version
      # (`memory-api --version`) is the commit.
      - name: Build the Go server
        working-directory: go/server
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          go version
          go build -trimpath -ldflags "-X main.version=$GITHUB_SHA" -o "$RUNNER_TEMP/out/memory-api" ./cmd/memory-api
          test "$("$RUNNER_TEMP/out/memory-api" --version)" = "$GITHUB_SHA"

      - uses: actions/download-artifact@v8
        with:
          name: admin-dist
          path: ${{ runner.temp }}/out

      - name: Write SHA256SUMS
        working-directory: ${{ runner.temp }}/out
        run: |
          sha256sum memory-api admin-dist.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # A published build is never replaced, since a deploy may be downloading
      # it: a re-run leaves it alone (and does not attest its own rebuild,
      # whose archive differs in its timestamps) and only clears a draft or
      # incomplete release left by a failed run.
      - name: Look for an earlier publish
        id: existing
        run: |
          if state=$(gh release view "$TAG" --json isDraft,assets \
              --jq 'if .isDraft then "incomplete"
                    elif ([.assets[].name] | sort) == ["SHA256SUMS", "admin-dist.tar.gz", "memory-api"] then "complete"
                    else "incomplete" end' 2>"$RUNNER_TEMP/view.err"); then
              :
          elif grep -q "release not found" "$RUNNER_TEMP/view.err"; then
              state=missing
          else
              cat "$RUNNER_TEMP/view.err"
              exit 1
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [ "$state" = complete ]; then
              echo "$TAG is already published; leaving it as it is."
          fi

      # Before the publish, so a published build always has its attestation.
      - name: Attest the build
        if: steps.existing.outputs.state != 'complete'
        uses: actions/attest@v4
        with:
          subject-checksums: ${{ runner.temp }}/out/SHA256SUMS

      # Never "latest": deploy-tools.yml reads releases/latest for the client
      # binaries. gh keeps the release a draft until every file is uploaded,
      # so a deploy never sees it half-published.
      - name: Publish the build
        if: steps.existing.outputs.state != 'complete'
        working-directory: ${{ runner.temp }}/out
        env:
          STATE: ${{ steps.existing.outputs.state }}
        run: |
          if [ "$STATE" = incomplete ]; then
              echo "Removing the incomplete release $TAG"
              gh release delete "$TAG" --cleanup-tag --yes
          fi
          gh release create "$TAG" memory-api admin-dist.tar.gz SHA256SUMS \
              --target "$GITHUB_SHA" \
              --title "Build ${GITHUB_SHA:0:12}" \
              --notes "Per-commit server and admin UI build of $GITHUB_SHA. Deployed by infrastructure/roles/memory-api-go." \
              --prerelease \
              --latest=false

  # Deletes all but the newest KEEP_BUILDS build releases and their tags. One
  # at a time, so two prunes do not try to delete the same release. A newer
  # prune replacing a pending one loses nothing: each prune covers them all.
  prune-builds:
    name: Prune Builds
    needs: build-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: prune-builds
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      # No checkout in this job, so gh needs the repository named.
      GH_REPO: ${{ github.repository }}
      KEEP_BUILDS: 20
    steps:
      - name: Prune old builds
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.tag_name | startswith("build-")) | [.created_at, .tag_name] | @tsv' \
              | sort -r \
              | tail -n +$((KEEP_BUILDS + 1)) \
              | cut -f2 \
              | while read -r old; do
                  echo "Deleting $old"
                  gh release delete "$old" --cleanup-tag --yes
              done

---
# A fresh database is built from the baseline: migrations/schema.sql (a
# schema-only dump of production) and migrations/seed.sql (the config keys and
# built-in rows the server needs), loaded together in one transaction. Only the
# *_up.sql files that come after the baseline are applied on top. A database
# that already has the schema (production) never loads the baseline; it applies
# pending *_up.sql files only. "Fresh" is "no actors table": roles/postgresql
# creates an empty migrations_applied before this runs, so that table cannot
# tell a fresh database from a migrated one. One transaction means a failed load
# leaves the database empty, and the next run loads it again. A database with
# no actors table but other tables is neither, and the deploy stops on it
# rather than load the baseline over whatever is there.
- name: Check whether the database has the schema yet
  shell: |
    sudo -u postgres psql -d {{ database_name }} -t -A -c "
      SELECT CASE
        WHEN to_regclass('public.actors') IS NOT NULL THEN 'existing'
        WHEN EXISTS (SELECT 1 FROM pg_tables WHERE schemaname = 'public' AND tablename <> 'migrations_applied') THEN 'partial'
        ELSE 'fresh'
      END;"
  register: database_state
  changed_when: false

- name: Stop on a database that is neither fresh nor migrated
  fail:
    msg: "{{ database_name }} has tables but no actors table. Check it by hand: the baseline loads only into an empty database."
  when: database_state.stdout | trim == 'partial'

- name: Load the baseline schema and seed into a fresh database
  shell: |
    sudo -u postgres psql -d {{ database_name }} -v ON_ERROR_STOP=1 --single-transaction \
      -f {{ project_root }}/migrations/schema.sql \
      -f {{ project_root }}/migrations/seed.sql
  when: database_state.stdout | trim == 'fresh'

# seed.sql leaves the two secret keys empty. Fill an empty one with 244 random
# bits from Postgres's strong random source (two v4 UUIDs, hashed to 64 hex
# characters: the 32-byte key the encryption code expects), so the value never
# appears in a command line or in Ansible's output. A key that has a value is
# never changed: the encryption key protects stored provider API keys, and the
# bearer secret signs every issued MCP token. Runs on every deploy, so it also
# repairs an install whose keys were left empty.
- name: Generate any empty secret config keys
  shell: |
    sudo -u postgres psql -d {{ database_name }} -v ON_ERROR_STOP=1 -t -A -c "
      WITH filled AS (
        UPDATE config
           SET value = encode(sha256((gen_random_uuid()::text || gen_random_uuid()::text)::bytea), 'hex'),
               updated_at = NOW()
         WHERE key IN ('mcp_oauth_bearer_secret', 'virtual_agent_encryption_key')
           AND coalesce(value, '') = ''
        RETURNING key
      )
      SELECT count(*) FROM filled;"
  register: secret_keys_filled
  changed_when: secret_keys_filled.stdout | trim != '0'
  notify: Restart memory-api

- name: Find all up migration files
  find:
    paths: "{{ project_root }}/migrations"
    patterns: "*_up.sql"
  register: migration_files

- name: Get applied migrations
  shell: |
    sudo -u postgres psql -d {{ database_name }} -t -A -c "SELECT migration_id FROM migrations_applied ORDER BY migration_id;"
  register: applied_migrations
  changed_when: false

- name: Set applied migrations list
  set_fact:
    applied_list: "{{ applied_migrations.stdout_lines | default([]) }}"

- name: Build pending migrations list
  set_fact:
    pending_migrations: >-
      {{
        migration_files.files
        | sort(attribute='path')
        | map(attribute='path')
        | map('basename')
        | map('regex_replace', '_up\.sql$', '')
        | reject('in', applied_list)
        | list
      }}

- name: Display pending migrations
  debug:
    msg: "Pending migrations: {{ pending_migrations }}"

# ON_ERROR_STOP=1 makes psql exit non-zero on the first SQL error.
# Without it, psql swallows errors inside BEGIN/COMMIT blocks and
# exits 0 anyway, so the && chain still records the migration as
# applied even when its SQL rolled back. Salem-engine ZBBS-119 hit
# this when its description strings overflowed setting.description
# varchar(255); fixing this side prophylactically.
- name: Apply pending migrations
  shell: |
    sudo -u postgres psql -d {{ database_name }} -v ON_ERROR_STOP=1 -f {{ project_root }}/migrations/{{ item }}_up.sql && \
    sudo -u postgres psql -d {{ database_name }} -v ON_ERROR_STOP=1 -c "INSERT INTO migrations_applied (migration_id) VALUES ('{{ item }}');"
  loop: "{{ pending_migrations }}"
  when: pending_migrations | length > 0

- name: Grant table permissions to application user
  shell: |
    sudo -u postgres psql -d {{ database_name }} -c "
      GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO {{ database_user }};
      GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO {{ database_user }};
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO {{ database_user }};
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO {{ database_user }};
    "
  changed_when: false

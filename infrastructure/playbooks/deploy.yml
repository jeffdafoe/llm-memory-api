---
- name: Deploy Memory API
  hosts: all
  become: yes
  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: Load secrets
      include_tasks: ../tasks/load-secrets.yml

    - name: Display deployment info
      debug:
        msg: "Deploying to {{ deploy_environment }} environment"

    # The rest of the postgresql role runs only from setup.yml; this part runs
    # on every deploy so a server that already exists keeps the guard.
    - name: Guard PostgreSQL against a missing conf.d
      include_tasks: ../roles/postgresql/tasks/confd-guard.yml

    # The rest of the common role runs only from setup.yml, as above.
    - name: Turn off systemd-resolved's LLMNR listener
      include_tasks: ../roles/common/tasks/resolved-llmnr.yml

  roles:
    - role: ../roles/nginx
    - role: ../roles/memory-api

  tasks:
    - name: Run pending migrations
      include_tasks: ../tasks/run-migrations.yml

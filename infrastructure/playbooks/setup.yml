---
- name: Provision Memory API
  hosts: all
  become: yes
  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: Load secrets
      include_tasks: ../tasks/load-secrets.yml

    - name: Display environment
      debug:
        msg: "Setting up {{ deploy_environment }} environment on {{ inventory_hostname }}"

    - name: Check the backend setting
      assert:
        that: memory_api_backend in ['node', 'go']
        fail_msg: "memory_api_backend is '{{ memory_api_backend }}'; it must be node or go"
        quiet: yes

  roles:
    - role: ../roles/common
    - role: ../roles/nodejs
    - role: ../roles/postgresql
    - role: ../roles/certbot
    - role: ../roles/nginx
    # Installs the Go binary, which tasks/create-admin.yml runs below. On a
    # fresh install setup.yml runs before deploy.yml, the other place this
    # role runs.
    - role: ../roles/memory-api-go
    - role: ../roles/memory-api

  tasks:
    - name: Run pending migrations
      include_tasks: ../tasks/run-migrations.yml

    - name: Create admin user
      include_tasks: ../tasks/create-admin.yml

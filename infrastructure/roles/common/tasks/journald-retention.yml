---
# Keep the systemd journal for 30 days. The journal holds client IP addresses
# (the Go server's "[mcp] connect" lines go to stdout, and so to journald), and
# the privacy policy at /privacy states this period. Without a limit journald
# keeps entries until the size cap pushes them out, which on this server was
# months. Runs from the role (setup.yml) and from deploy.yml.

- name: Create the systemd-journald drop-in directory
  file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: '0755'

# MaxRetentionSec deletes only whole archived journal files whose entries are
# all older than the limit. MaxFileSec=1day closes a file every day, so no
# entry outlives the 30 days by more than a day. The default (one month per
# file) would let entries live about 60 days.
- name: Set the journal retention period
  copy:
    dest: /etc/systemd/journald.conf.d/retention.conf
    mode: '0644'
    content: |
      # Managed by Ansible (roles/common/tasks/journald-retention.yml).
      # The privacy policy (/privacy) states this period; change both together.
      [Journal]
      MaxRetentionSec=30day
      MaxFileSec=1day
  register: journald_retention_conf

# journald reads its configuration only at start. Restarting it does not cut
# the log streams of running services: the unit keeps them in its file
# descriptor store (FileDescriptorStoreMax) and gets them back on restart.
- name: Restart systemd-journald to load the retention period
  command: systemctl try-restart systemd-journald.service
  register: journald_restart
  failed_when: journald_restart.rc not in [0, 5]
  when: journald_retention_conf.changed

# The restart loads the limit but deletes nothing by itself until the next
# rotation; vacuum removes the files that are already older now.
- name: Delete journal files older than the retention period
  command: journalctl --vacuum-time=30d
  when: journald_retention_conf.changed

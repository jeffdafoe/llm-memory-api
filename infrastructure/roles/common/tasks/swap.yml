---
# A swap file for a small server (LLM-985). Runs from the role (setup.yml)
# only, and only when swap_file_size_mb is above 0.
#
# Why: with no swap, a memory spike leaves the kernel one thing to free, the
# file pages, which include the code of the running services. They then
# re-read their own code from disk over and over, and the server stalls for
# minutes before the OOM killer acts (2026-11-15: 20 minutes, PostgreSQL and
# the API with it). Swap gives idle data somewhere to go first.
#
# Every task is a no-op on a server that already has this state.

- name: Check for the swap file
  stat:
    path: "{{ swap_file_path }}"
  register: swap_file_stat

- name: List the active swap
  command: swapon --noheadings --show=NAME
  register: swap_active
  changed_when: false

# A server that already has swap from somewhere else (a partition, a file the
# host's image made) is left as it is: a second swap area is not ours to add.
- name: Decide whether to create the swap file
  set_fact:
    swap_file_create: "{{ not swap_file_stat.stat.exists and swap_active.stdout_lines | length == 0 }}"
    swap_file_managed: "{{ swap_file_stat.stat.exists or swap_active.stdout_lines | length == 0 }}"

- name: Report swap this role does not manage
  debug:
    msg: "Swap is already active ({{ swap_active.stdout_lines | join(', ') }}) and {{ swap_file_path }} does not exist; leaving it alone."
  when: not (swap_file_managed | bool)

- name: Create and turn on the swap file
  when: swap_file_managed | bool
  block:
    # fallocate, not dd: instant, and ext4 and xfs both accept a fallocated
    # swap file on the kernels Debian 12+ and Ubuntu 22.04+ ship.
    - name: Allocate the swap file
      command: fallocate -l {{ swap_file_size_mb }}M {{ swap_file_path }}
      when: swap_file_create | bool

    # Before mkswap: the file must never be readable by other users while it
    # holds memory pages.
    - name: Restrict the swap file to root
      file:
        path: "{{ swap_file_path }}"
        owner: root
        group: root
        mode: '0600'

    - name: Format the swap file
      command: mkswap {{ swap_file_path }}
      when: swap_file_create | bool

    - name: Turn the swap file on
      command: swapon {{ swap_file_path }}
      when: swap_file_path not in swap_active.stdout_lines

    # So it comes back after a reboot. The regexp matches any existing line
    # for this file, so the line is replaced, never added twice.
    - name: Add the swap file to /etc/fstab
      lineinfile:
        path: /etc/fstab
        regexp: '^{{ swap_file_path | regex_escape }}\s'
        line: "{{ swap_file_path }} none swap sw 0 0"

# The kernel default (60) moves idle pages to swap early. A low value keeps
# PostgreSQL and the API in RAM and uses swap only under real pressure.
- name: Set vm.swappiness
  copy:
    dest: /etc/sysctl.d/99-swappiness.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      vm.swappiness={{ swap_swappiness }}

# The file above takes effect at boot. Compare the running value on every run,
# not only when the file changed: a run that wrote the file and then stopped
# would otherwise never apply it.
- name: Read the running vm.swappiness
  command: sysctl -n vm.swappiness
  register: swap_swappiness_current
  changed_when: false

- name: Apply vm.swappiness
  command: "sysctl -w vm.swappiness={{ swap_swappiness | int }}"
  when: (swap_swappiness_current.stdout | int) != (swap_swappiness | int)

---
# Install the Go server and the admin UI's built files from the per-commit
# build CI publishes (the build-artifacts job in .github/workflows/ci.yml,
# release build-<sha>). The VPS compiles nothing. The Go unit is enabled only
# when memory_api_backend is "go" (group_vars/all.yml).
# deploy.yml runs this role before the Node one, so a missing or corrupt build
# stops the deploy before it changes anything of Node's and before migrations.

- name: Read the commit being deployed
  command: git -C {{ repo_root }} rev-parse HEAD
  register: deploy_commit
  changed_when: false

- name: Set the build release facts
  set_fact:
    build_sha: "{{ deploy_commit.stdout | trim }}"
    build_url: "https://github.com/jeffdafoe/llm-memory-api/releases/download/build-{{ deploy_commit.stdout | trim }}"
    build_assets:
      - memory-api
      - admin-dist.tar.gz
      - SHA256SUMS

# CI publishes the build a few minutes after the merge. A deploy started
# before that finds no release (404) and stops here.
- name: Look up the build release
  uri:
    url: "https://api.github.com/repos/jeffdafoe/llm-memory-api/releases/tags/build-{{ build_sha }}"
    status_code: [200, 404]
  register: build_release

- name: Stop if the build is not published
  assert:
    that:
      - build_release.status == 200
      - build_assets | difference(build_release.json.assets | default([]) | map(attribute='name') | list) | length == 0
    fail_msg: "build for {{ build_sha }} is not published yet; wait for CI and deploy again"
    quiet: yes

# Both files are downloaded, checked and staged before either is installed,
# so a failure in either leaves both the binary and the admin UI as they were.
- name: Download, stage and install the build
  vars:
    admin_dist: "{{ repo_root }}/node/api/public/admin/dist"
  block:
    - name: Create a private download directory
      tempfile:
        state: directory
        prefix: memory-api-build-
      register: build_dir

    # get_url checks each download against the line for its name in
    # SHA256SUMS and fails on a mismatch. It deletes an existing destination
    # whose checksum differs before downloading, so the binary goes to a .new
    # file next to the installed one (same filesystem, so the install below
    # is a rename).
    - name: Download the Go server binary
      get_url:
        url: "{{ build_url }}/memory-api"
        dest: "{{ go_server_bin }}.new"
        checksum: "sha256:{{ build_url }}/SHA256SUMS"
        force: yes
        owner: root
        group: root
        mode: "0755"
        timeout: 120

    - name: Download the admin UI build
      get_url:
        url: "{{ build_url }}/admin-dist.tar.gz"
        dest: "{{ build_dir.path }}/admin-dist.tar.gz"
        checksum: "sha256:{{ build_url }}/SHA256SUMS"
        mode: "0600"
        timeout: 120

    # Removes a dist.new left by an earlier failed run.
    - name: Clear the admin UI staging directory
      file:
        path: "{{ admin_dist }}.new"
        state: absent

    - name: Create the admin UI staging directory
      file:
        path: "{{ admin_dist }}.new"
        state: directory
        mode: "0755"

    # --no-same-owner: the files belong to root, not to the CI runner's uid
    # stored in the archive.
    - name: Unpack the admin UI build
      unarchive:
        src: "{{ build_dir.path }}/admin-dist.tar.gz"
        dest: "{{ admin_dist }}.new"
        remote_src: yes
        extra_opts:
          - --no-same-owner

    - name: Install the Go server binary
      command: mv -f {{ go_server_bin }}.new {{ go_server_bin }}

    # The admin UI is served from project_root's public/admin/dist: by Express
    # under "node", by nginx under "go". The memory-api role copies node/api
    # from repo_root to project_root after this role, so the files land where
    # both read them. The old dist is
    # replaced whole, so no file of an older build stays behind.
    - name: Install the admin UI build
      shell: |
        set -eu
        rm -rf "{{ admin_dist }}"
        mv -T "{{ admin_dist }}.new" "{{ admin_dist }}"

  always:
    - name: Remove the download directory
      file:
        path: "{{ build_dir.path }}"
        state: absent
      when: build_dir.path is defined

- name: Install the Go server's systemd unit
  template:
    src: memory-api-go.service.j2
    dest: /etc/systemd/system/memory-api-go.service
    mode: "0644"
  notify: Reload systemd for memory-api-go

# Enabled only when memory_api_backend is "go". The unit Conflicts= with
# memory-api, so starting one stops the other rather than fighting it for the
# port. Nothing is started or stopped here: deploy.sh restarts the enabled unit
# after the migrations, so on the switch Node serves until then, and on a
# switch back the memory-api role starts Node (which stops Go).
- name: Enable the Go server only when it is the backend
  systemd:
    name: memory-api-go
    enabled: "{{ memory_api_backend == 'go' }}"
    daemon_reload: yes

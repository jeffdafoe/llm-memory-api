---
- name: Ensure service user exists
  user:
    name: "{{ app_user }}"
    system: yes
    shell: /usr/sbin/nologin
    home: "/home/{{ app_user }}"
    create_home: yes

- name: Create log directory
  file:
    path: /var/log/llm-memory-api
    state: directory
    owner: "{{ app_user }}"
    mode: "0755"

- name: Configure log rotation
  template:
    src: logrotate.j2
    dest: /etc/logrotate.d/llm-memory-api
    mode: "0644"

# Socket Firewall (sfw) — wraps `npm install` to block known-malicious
# packages at the network layer before they can land on disk. Installed
# globally so all subsequent npm tasks below can prefix `sfw`. The npm
# install of sfw itself is unwrapped (chicken-and-egg) — we trust this
# one package from socket.dev. Free tier, no API key, anonymous telemetry.
- name: Install Socket Firewall (sfw) globally
  npm:
    name: sfw
    global: yes
    state: present

- name: Create deployment directory
  file:
    path: "{{ project_root }}"
    state: directory
    owner: "{{ app_user }}"
    mode: "0755"
  when: repo_root != project_root

# The admin UI is built in CI; roles/memory-api-go unpacks it into
# public/admin/dist before this role runs. The repo side used to get a full
# npm install for the Vite build, and the copy below carried that tree over.
- name: Remove the old build dependencies in repo
  file:
    path: "{{ repo_root }}/node/api/node_modules"
    state: absent
  when: repo_root != project_root

# node_modules is excluded, and an excluded path is not deleted on the
# receiving side either: project_root keeps its own tree, which the
# `npm install --omit=dev` below brings up to date.
- name: Deploy application code
  synchronize:
    src: "{{ repo_root }}/node/api/"
    dest: "{{ project_root }}/"
    delete: yes
    rsync_opts:
      - "--exclude=/node_modules"
  delegate_to: "{{ inventory_hostname }}"
  when: repo_root != project_root

- name: Deploy static assets
  synchronize:
    src: "{{ repo_root }}/static/"
    dest: "{{ project_root }}/static/"
    delete: yes
  delegate_to: "{{ inventory_hostname }}"
  when: repo_root != project_root

- name: Deploy maintenance page
  copy:
    src: "{{ repo_root }}/node/maintenance.html"
    dest: "{{ project_root }}/maintenance.html"
    remote_src: yes
  when: repo_root != project_root

- name: Deploy migrations
  synchronize:
    src: "{{ repo_root }}/migrations/"
    dest: "{{ project_root }}/migrations/"
    delete: yes
  delegate_to: "{{ inventory_hostname }}"
  when: repo_root != project_root

- name: Set deployment directory ownership
  file:
    path: "{{ project_root }}"
    owner: "{{ app_user }}"
    recurse: yes
  when: repo_root != project_root

- name: Create secrets directory
  file:
    path: /etc/memory-api
    state: directory
    owner: "{{ app_user }}"
    mode: "0700"

- name: Deploy environment file
  template:
    src: env.j2
    dest: /etc/memory-api/env
    mode: "0600"
  notify: Restart memory-api

# sfw checks for a new firewall binary at most once an hour and records the
# time in its own install directory (/usr/lib/node_modules/sfw/.sfw-cache/
# next-check), which only root can write. The npm installs below run as
# app_user, so when the hour has passed, sfw fails with EACCES on that file.
# Running sfw once as root here does the check and writes the file, so the
# app_user run inside the same hour has nothing to write.
- name: Refresh the sfw firewall binary as root
  command: sfw npm --version
  changed_when: false

- name: Install npm dependencies
  command: sfw npm install --omit=dev
  args:
    chdir: "{{ project_root }}"
  become_user: "{{ app_user }}"
  when: repo_root != project_root

- name: Install npm dependencies (development)
  command: sfw npm install
  args:
    chdir: "{{ project_root }}/node/api"
  become_user: "{{ app_user }}"
  when: repo_root == project_root

- name: Create systemd service
  template:
    src: memory-api.service.j2
    dest: /etc/systemd/system/memory-api.service
  notify:
    - Reload systemd
    - Restart memory-api

# Under "go" the Node unit is only disabled, not stopped: it keeps serving
# until deploy.sh restarts memory-api-go after the migrations, which stops it
# through Conflicts=. Its code and npm tree above stay current, so a switch
# back to "node" can start it at once.
- name: Enable and start memory-api service
  service:
    name: memory-api
    enabled: "{{ memory_api_backend == 'node' }}"
    state: "{{ 'started' if memory_api_backend == 'node' else omit }}"

- name: Ensure cleanup script is executable
  file:
    path: "{{ project_root }}/scripts/db-cleanup.sh"
    mode: "0755"

- name: Configure daily database cleanup cron job
  cron:
    name: "memory-api db cleanup"
    minute: "15"
    hour: "3"
    job: "{{ project_root }}/scripts/db-cleanup.sh >> /var/log/llm-memory-api/db-cleanup.log 2>&1"

- name: Ensure backup script is executable
  file:
    path: "{{ project_root }}/scripts/pg-backup.sh"
    mode: "0755"

- name: Configure daily PostgreSQL backup cron job
  cron:
    name: "postgresql daily backup"
    minute: "0"
    hour: "2"
    job: "{{ project_root }}/scripts/pg-backup.sh >> /var/log/llm-memory-api/pg-backup.log 2>&1"

# Weekly report of pending apt upgrades and runtimes near end of life, mailed
# inside this instance. It only reports; it never installs anything.
- name: Pick the staleness check recipient
  set_fact:
    staleness_recipient: "{{ staleness_check_recipient | default(admin_username | default('admin'), true) }}"

# The name goes on a cron command line, where shell quoting does not protect
# `%` (cron turns it into a newline) — so allow only plain name characters.
- name: Check the staleness check recipient is a plain actor name
  assert:
    # \Z, not $: Python's $ also matches before a trailing newline.
    that: staleness_recipient is match('^[A-Za-z0-9][A-Za-z0-9._@-]*\Z')
    fail_msg: "staleness_check_recipient (or admin_username) '{{ staleness_recipient }}' must be a plain actor name: letters, digits, . _ @ -"

# Runs the backend's own implementation: scripts/staleness-check.js under
# "node", `memory-api staleness-check` (the Go binary) under "go".
- name: Configure weekly staleness check cron job
  vars:
    staleness_command: "{{ (go_server_bin | quote) ~ ' staleness-check' if memory_api_backend == 'go' else '/usr/bin/node ' ~ ((project_root ~ '/scripts/staleness-check.js') | quote) }}"
  cron:
    name: "memory-api staleness check"
    weekday: "1"
    minute: "30"
    hour: "12"
    job: "{{ staleness_command }} {{ staleness_recipient | quote }} >> /var/log/llm-memory-api/staleness-check.log 2>&1"

- name: Deploy tools (Go client binaries)
  include_tasks: deploy-tools.yml

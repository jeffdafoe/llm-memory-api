---
- name: Ensure service user exists
  user:
    name: "{{ app_user }}"
    system: yes
    shell: /usr/sbin/nologin
    home: "/home/{{ app_user }}"
    create_home: yes

- name: Create log directory
  file:
    path: /var/log/llm-memory-api
    state: directory
    owner: "{{ app_user }}"
    mode: "0755"

- name: Configure log rotation
  template:
    src: logrotate.j2
    dest: /etc/logrotate.d/llm-memory-api
    mode: "0644"

- name: Create deployment directory
  file:
    path: "{{ project_root }}"
    state: directory
    owner: "{{ app_user }}"
    mode: "0755"
  when: repo_root != project_root

# What nginx serves itself: the admin UI (roles/memory-api-go unpacks the CI
# build into public/admin/dist before this role runs), the landing pages,
# llms.txt and openapi.yaml.
- name: Deploy public files
  synchronize:
    src: "{{ repo_root }}/node/api/public/"
    dest: "{{ project_root }}/public/"
    delete: yes
  delegate_to: "{{ inventory_hostname }}"
  when: repo_root != project_root

# Only the two cron scripts below. --delete-excluded removes anything else in
# project_root/scripts, such as the Node scripts an older deploy copied.
- name: Deploy cron scripts
  synchronize:
    src: "{{ repo_root }}/node/api/scripts/"
    dest: "{{ project_root }}/scripts/"
    delete: yes
    rsync_opts:
      - "--include=/db-cleanup.sh"
      - "--include=/pg-backup.sh"
      - "--exclude=*"
      - "--delete-excluded"
  delegate_to: "{{ inventory_hostname }}"
  when: repo_root != project_root

# Files of the Node server that earlier deploys copied into project_root.
- name: Remove the Node server's files
  file:
    path: "{{ project_root }}/{{ item }}"
    state: absent
  loop:
    - node_modules
    - src
    - package.json
    - package-lock.json
    - vite.config.js
  when: repo_root != project_root

- name: Deploy static assets
  synchronize:
    src: "{{ repo_root }}/static/"
    dest: "{{ project_root }}/static/"
    delete: yes
  delegate_to: "{{ inventory_hostname }}"
  when: repo_root != project_root

- name: Deploy maintenance page
  copy:
    src: "{{ repo_root }}/node/maintenance.html"
    dest: "{{ project_root }}/maintenance.html"
    remote_src: yes
  when: repo_root != project_root

- name: Deploy migrations
  synchronize:
    src: "{{ repo_root }}/migrations/"
    dest: "{{ project_root }}/migrations/"
    delete: yes
  delegate_to: "{{ inventory_hostname }}"
  when: repo_root != project_root

- name: Set deployment directory ownership
  file:
    path: "{{ project_root }}"
    owner: "{{ app_user }}"
    recurse: yes
  when: repo_root != project_root

- name: Create secrets directory
  file:
    path: /etc/memory-api
    state: directory
    owner: "{{ app_user }}"
    mode: "0700"

- name: Deploy environment file
  template:
    src: env.j2
    dest: /etc/memory-api/env
    mode: "0600"
  notify: Restart memory-api

# The Node server's unit (memory-api.service), from before the Go server.
- name: Look for the Node server's unit
  stat:
    path: /etc/systemd/system/memory-api.service
  register: node_unit

- name: Stop and disable the Node server's unit
  systemd:
    name: memory-api
    state: stopped
    enabled: no
  when: node_unit.stat.exists

- name: Remove the Node server's unit
  file:
    path: /etc/systemd/system/memory-api.service
    state: absent
  notify: Reload systemd

- name: Ensure cleanup script is executable
  file:
    path: "{{ project_root }}/scripts/db-cleanup.sh"
    mode: "0755"

- name: Configure daily database cleanup cron job
  cron:
    name: "memory-api db cleanup"
    minute: "15"
    hour: "3"
    job: "{{ project_root }}/scripts/db-cleanup.sh >> /var/log/llm-memory-api/db-cleanup.log 2>&1"

- name: Ensure backup script is executable
  file:
    path: "{{ project_root }}/scripts/pg-backup.sh"
    mode: "0755"

- name: Configure daily PostgreSQL backup cron job
  cron:
    name: "postgresql daily backup"
    minute: "0"
    hour: "2"
    job: "{{ project_root }}/scripts/pg-backup.sh >> /var/log/llm-memory-api/pg-backup.log 2>&1"

# Weekly report of pending apt upgrades and runtimes near end of life, mailed
# inside this instance. It only reports; it never installs anything.
- name: Pick the staleness check recipient
  set_fact:
    staleness_recipient: "{{ staleness_check_recipient | default(admin_username | default('admin'), true) }}"

# The name goes on a cron command line, where shell quoting does not protect
# `%` (cron turns it into a newline) — so allow only plain name characters.
- name: Check the staleness check recipient is a plain actor name
  assert:
    # \Z, not $: Python's $ also matches before a trailing newline.
    that: staleness_recipient is match('^[A-Za-z0-9][A-Za-z0-9._@-]*\Z')
    fail_msg: "staleness_check_recipient (or admin_username) '{{ staleness_recipient }}' must be a plain actor name: letters, digits, . _ @ -"

- name: Configure weekly staleness check cron job
  cron:
    name: "memory-api staleness check"
    weekday: "1"
    minute: "30"
    hour: "12"
    job: "{{ go_server_bin | quote }} staleness-check {{ staleness_recipient | quote }} >> /var/log/llm-memory-api/staleness-check.log 2>&1"

- name: Deploy tools (Go client binaries)
  include_tasks: deploy-tools.yml

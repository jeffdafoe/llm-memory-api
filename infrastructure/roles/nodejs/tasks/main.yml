---
# Install Node.js from NodeSource when it is missing OR when the installed
# major version differs from nodejs_version. Changing nodejs_version in
# group_vars therefore moves an existing host to the new major on the next
# setup run. Patch releases within the same major are NOT applied here —
# those stay a deliberate `apt upgrade`.
- name: Read installed Node.js major version
  command: node -p "process.versions.node.split('.')[0]"
  register: nodejs_installed_major
  changed_when: false
  failed_when: false
  # Read-only, so run it in --check mode too; the tasks below depend on it.
  check_mode: false

- name: Decide whether Node.js needs installing
  set_fact:
    nodejs_needs_install: "{{ nodejs_installed_major.rc != 0 or nodejs_installed_major.stdout | trim != nodejs_version | string }}"

- name: Download NodeSource setup script
  get_url:
    url: "https://deb.nodesource.com/setup_{{ nodejs_version }}.x"
    dest: /tmp/nodesource_setup.sh
    mode: "0755"
  when: nodejs_needs_install

# Rewrites /etc/apt/sources.list.d/nodesource.sources to point at the
# node_<nodejs_version>.x repository.
- name: Run NodeSource setup script
  command: /tmp/nodesource_setup.sh
  when: nodejs_needs_install

# state: latest so a host on an older major is upgraded; `present` would
# leave the already-installed package alone.
- name: Install Node.js
  apt:
    name: nodejs
    state: latest
    update_cache: yes
  when: nodejs_needs_install

- name: Remove NodeSource setup script
  file:
    path: /tmp/nodesource_setup.sh
    state: absent
  when: nodejs_needs_install

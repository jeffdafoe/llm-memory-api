---
- name: Install nginx
  apt:
    name: nginx
    state: present

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Remove legacy catch-all page
  file:
    path: /var/www/index.html
    state: absent

- name: Deploy rate limiting configuration
  template:
    src: rate-limiting.conf.j2
    dest: /etc/nginx/conf.d/rate-limiting.conf
  notify: Reload nginx

- name: Remove legacy hand-managed nginx configs
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/sites-enabled/llm-memory.conf
    - /etc/nginx/sites-available/llm-memory.conf
    - /etc/nginx/sites-enabled/memory.jeffdafoe.com.conf
    - /etc/nginx/sites-available/memory.jeffdafoe.com.conf
  notify: Reload nginx

- name: Create nginx site configuration
  template:
    src: "site-{{ deploy_environment }}.conf.j2"
    dest: "/etc/nginx/sites-available/{{ project_name }}.conf"
  notify: Reload nginx

- name: Enable nginx site
  file:
    src: "/etc/nginx/sites-available/{{ project_name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ project_name }}.conf"
    state: link
  notify: Reload nginx

- name: Ensure nginx is running
  service:
    name: nginx
    state: started
    enabled: yes

# nginx logs hold client IP addresses, and the privacy policy at /privacy
# states how long they are kept. This replaces the file the nginx-common
# package installs, with two changes. Debian's "notifempty" skips rotating an
# empty log, so a quiet log's old files never move down the "rotate 14" chain
# and stay for months: "ifempty" makes every log rotate every day. "maxage 15"
# deletes rotated files older than 15 days each time their log rotates, which
# also clears files left from before this change at the first rotation after
# the deploy. So 15 days is the cleanup threshold, applied at each daily
# rotation; a missed or failed rotation leaves files until the next one. The
# rest is Debian's file as shipped. The file is a package conffile: if an
# nginx-common upgrade also changes it, dpkg may ask which version to keep.
# Keep this one, then check the package's version for changed hooks.
- name: Set the nginx log rotation
  copy:
    dest: /etc/logrotate.d/nginx
    mode: '0644'
    # Debug mode checks the syntax and rotates nothing, so a bad file never
    # replaces the live one.
    validate: '/usr/sbin/logrotate -d -s /dev/null %s'
    content: |
      # Managed by Ansible (roles/nginx/tasks/main.yml).
      # The privacy policy (/privacy) states this period; change both together.
      /var/log/nginx/*.log {
      	daily
      	missingok
      	rotate 14
      	maxage 15
      	compress
      	delaycompress
      	ifempty
      	create 0640 www-data adm
      	sharedscripts
      	prerotate
      		if [ -d /etc/logrotate.d/httpd-prerotate ]; then \
      			run-parts /etc/logrotate.d/httpd-prerotate; \
      		fi \
      	endscript
      	postrotate
      		invoke-rc.d nginx rotate >/dev/null 2>&1
      	endscript
      }

# ── fail2ban for WordPress/CMS scanning bots ──

- name: Install fail2ban
  apt:
    name: fail2ban
    state: present

- name: Deploy WordPress scanning filter
  template:
    src: fail2ban-wordpress-filter.conf.j2
    dest: /etc/fail2ban/filter.d/nginx-wordpress.conf
  notify: Restart fail2ban

- name: Remove old WordPress-only jail config
  file:
    path: /etc/fail2ban/jail.d/nginx-wordpress.conf
    state: absent
  notify: Restart fail2ban

- name: Deploy fail2ban jails (sshd + nginx-wordpress)
  template:
    src: fail2ban-jails.conf.j2
    dest: /etc/fail2ban/jail.d/memory-api.conf
  notify: Restart fail2ban

- name: Ensure fail2ban is running
  service:
    name: fail2ban
    state: started
    enabled: yes

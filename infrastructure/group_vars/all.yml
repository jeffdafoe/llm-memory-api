# Shared variables across all environments

# PostgreSQL
postgresql_version: "17"

# Node.js
nodejs_version: "24"

# Go server binary (LLM-902), built in CI and downloaded by
# roles/memory-api-go. Installed outside project_root, which the Node deploy
# rsyncs with delete.
go_server_bin: /usr/local/bin/memory-api

# Which server answers on memory_api_port (LLM-902 step 11): "node"
# (memory-api.service) or "go" (memory-api-go.service). Both listen on the
# same port and their units conflict, so exactly one runs. With "go", nginx
# serves the admin UI (with its CSP), the landing pages, llms.txt and
# openapi.yaml itself, because the Go server does not; the weekly staleness
# check runs the Go binary. Node stays installed and up to date under "go", so
# switching back is the same flip: a deploy with "node" enables Node and
# disables Go.
memory_api_backend: node
memory_api_unit: "{{ 'memory-api-go' if memory_api_backend == 'go' else 'memory-api' }}"

# Weekly staleness check (pending apt upgrades, end-of-life warnings) mails
# this actor. Empty means the admin user (admin_username). Set it per server
# in local-secrets.yml, e.g. `staleness_check_recipient: myagent`.
staleness_check_recipient: ""

# Memory API
memory_api_port: 3100
memory_api_host: 127.0.0.1
project_name: memory-api
repo_root: /opt/llm-memory-api
project_root: /var/www/memory-api
git_repository: "https://github.com/jeffdafoe/llm-memory-api.git"

# Public-facing domains serve a landing page at /
# Internal domains redirect / → /admin/
# public_domains is prompted during install and stored in local-secrets.yml (gitignored)
#
# SSL — certbot_email and server_names are also prompted during install
# server_names is comma-separated (e.g. "memory.example.com,memory2.example.com")
# First domain is primary, all domains get their own SSL cert and nginx server block

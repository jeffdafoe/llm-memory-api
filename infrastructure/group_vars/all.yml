# Shared variables across all environments

# PostgreSQL
postgresql_version: "17"

# The server binary, built in CI and downloaded by roles/memory-api-go. It
# runs as memory-api-go.service. Installed outside project_root, parts of which
# the deploy rsyncs with delete.
go_server_bin: /usr/local/bin/memory-api

# Which build the deploy installs. Empty: main's head and CI's per-commit build
# build-<sha> (linux/amd64 only). A release tag such as v1.7.0: that tag's
# code and its release files. Set it per server in local-secrets.yml
# (install.sh <version> does); deploy.sh reads it there too.
memory_api_release: ""

# cosign verifies the build provenance attestation of every downloaded build
# file before anything is installed (roles/memory-api-go/files/verify-build.sh).
# The checksums are from the release's cosign_checksums.txt; raise all three
# lines together.
cosign_version: v3.1.4
cosign_sha256:
  amd64: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
  arm64: ade83b7aac62e131cacfe96d958948b2150cc9efec46a570a2649b8e27dedad2
cosign_bin: /usr/local/bin/cosign

# Weekly staleness check (pending apt upgrades, end-of-life warnings) mails
# this actor. Empty means the admin user (admin_username). Set it per server
# in local-secrets.yml, e.g. `staleness_check_recipient: myagent`.
staleness_check_recipient: ""

# Memory API
memory_api_port: 3100
memory_api_host: 127.0.0.1
project_name: memory-api
repo_root: /opt/llm-memory-api
project_root: /var/www/memory-api
git_repository: "https://github.com/jeffdafoe/llm-memory-api.git"

# Public-facing domains serve a landing page at /
# Internal domains redirect / → /admin/
# public_domains is prompted during install and stored in local-secrets.yml (gitignored)
#
# SSL — certbot_email and server_names are also prompted during install
# server_names is comma-separated (e.g. "memory.example.com,memory2.example.com")
# First domain is primary, all domains get their own SSL cert and nginx server block
